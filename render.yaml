services:
  # -------------------------------------------------------------
  # Backend Web Service (Express + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: kader-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:deploy && npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: kader-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_SERVICE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLIENT_URL
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (Vite + React)
  # -------------------------------------------------------------
  - type: web
    name: kader-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: kader-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
          property: host

databases:
  # -------------------------------------------------------------
  # PostgreSQL Managed Database
  # -------------------------------------------------------------
  - name: kader-db
    databaseName: kader_ats_db
    user: kader_admin
    plan: free
